<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch room</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="room-wrap">
    <div class="room-top">
      <div>
        <div class="room-title" id="videoTitle">Loading...</div>
        <div class="room-code">Room code: <span id="roomCodeText"></span> <span class="version-badge" id="versionBadge"></span></div>
      </div>
      <div class="people" id="peopleList"></div>
    </div>

    <div class="player-frame" id="playerFrame">
      <video id="player" controls playsinline></video>
    </div>

    <div class="status-bar">
      <span id="statusText"></span>
      <span id="liveIndicator"></span>
    </div>

    <div class="copy-row">
      <button class="btn btn-ghost" id="copyBtn">Copy invite link</button>
      <button class="btn btn-ghost" id="homeBtn">Leave room</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="videos.js"></script>
  <script src="common.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const roomCode = (params.get("room") || "").toUpperCase();
    const myName = getMyName();
    const myClientId = getMyClientId();

    document.getElementById("roomCodeText").textContent = roomCode;
    applyVersionBadge();

    if (!roomCode || !myName) {
      window.location.href = "index.html" + (roomCode ? "?room=" + roomCode : "");
    }

    const sb = initSupabase();
    const player = document.getElementById("player");
    const playerFrame = document.getElementById("playerFrame");
    const statusText = document.getElementById("statusText");
    const liveIndicator = document.getElementById("liveIndicator");
    const peopleList = document.getElementById("peopleList");
    const toast = document.getElementById("toast");
    let currentVideoId = null;
    let sessionMaxFraction = 0;

    let applyingRemote = false;
    const SEEK_TOLERANCE = 1.2; // seconds - below this gap, no need to re-sync

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function flashSynced() {
      playerFrame.classList.add("synced");
      setTimeout(() => playerFrame.classList.remove("synced"), 500);
    }

    // --- load the room and its video ---
    sb.from("rooms").select("video").eq("code", roomCode).maybeSingle().then(({ data, error }) => {
      if (error || !data) {
        alert("This room no longer exists.");
        window.location.href = "index.html";
        return;
      }
      document.getElementById("videoTitle").textContent = data.video.title;
      player.src = data.video.url;
      currentVideoId = data.video.id;
      fetchProgressMap([currentVideoId]).then((map) => {
        sessionMaxFraction = map[currentVideoId] || 0;
      });
    });

    // --- realtime channel for this room (playback events + who's online) ---
    const channel = sb.channel("room:" + roomCode, {
      config: {
        broadcast: { self: false },
        presence: { key: myClientId }
      }
    });

    channel.on("broadcast", { event: "playback" }, (msg) => {
      const p = msg.payload;
      applyingRemote = true;
      flashSynced();

      if (Math.abs(player.currentTime - p.time) > SEEK_TOLERANCE) {
        player.currentTime = p.time;
      }

      if (p.action === "play") {
        player.play().catch(() => {});
        statusText.textContent = "Your friend hit play";
      } else if (p.action === "pause") {
        player.pause();
        statusText.textContent = "Your friend paused";
      } else if (p.action === "seek") {
        statusText.textContent = "Your friend jumped to a new spot";
      }

      setTimeout(() => { applyingRemote = false; }, 400);
    });

    channel.on("presence", { event: "sync" }, () => {
      const state = channel.presenceState();
      peopleList.innerHTML = "";
      const ids = Object.keys(state);
      const othersCount = ids.length - 1;

      ids.forEach((id) => {
        const info = state[id][0];
        const chip = document.createElement("div");
        chip.className = "chip";
        const dot = document.createElement("span");
        dot.className = "dot" + (id === myClientId ? " me" : "") + (othersCount > 0 ? " live" : "");
        chip.appendChild(dot);
        chip.appendChild(document.createTextNode(info.name + (id === myClientId ? " (you)" : "")));
        peopleList.appendChild(chip);
      });

      liveIndicator.textContent = othersCount > 0 ? "Your friend is here ●" : "Waiting for your friend...";
      liveIndicator.className = othersCount > 0 ? "live" : "";
    });

    channel.subscribe(async (status) => {
      if (status === "SUBSCRIBED") {
        await channel.track({ name: myName });
      }
    });

    function sendPlayback(action) {
      if (applyingRemote) return;
      channel.send({
        type: "broadcast",
        event: "playback",
        payload: { action: action, time: player.currentTime }
      });
    }

    player.addEventListener("play", () => sendPlayback("play"));
    player.addEventListener("pause", () => sendPlayback("pause"));
    player.addEventListener("seeked", () => sendPlayback("seek"));

    // --- save watch progress, shared with your friend, so the home page can show it ---
    let lastProgressSave = 0;
    function maybeSaveProgress(force) {
      if (!currentVideoId || !player.duration) return;
      const frac = player.currentTime / player.duration;
      if (frac <= sessionMaxFraction) return;
      const now = Date.now();
      if (!force && now - lastProgressSave < 4000) return;
      lastProgressSave = now;
      sessionMaxFraction = frac;
      saveSharedProgress(currentVideoId, frac);
    }
    player.addEventListener("timeupdate", () => maybeSaveProgress(false));
    player.addEventListener("pause", () => maybeSaveProgress(true));
    window.addEventListener("beforeunload", () => maybeSaveProgress(true));

    // --- buttons ---
    document.getElementById("copyBtn").addEventListener("click", () => {
      const link = window.location.origin + window.location.pathname.replace("room.html", "index.html") + "?room=" + roomCode;
      navigator.clipboard.writeText(link).then(() => showToast("Link copied ✓"));
    });

    document.getElementById("homeBtn").addEventListener("click", () => {
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
