<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch room</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="brandbar">
    <svg class="lamps" viewBox="0 0 46 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line class="link-line" x1="14" y1="10" x2="32" y2="10" stroke="#93a0bd" stroke-width="1"/>
      <circle class="halo" cx="8" cy="10" r="7" fill="#f2a541" fill-opacity="0.16"/>
      <circle class="bulb" cx="8" cy="10" r="3.4" fill="#f2a541"/>
      <circle class="halo right" cx="38" cy="10" r="7" fill="#5fb3a3" fill-opacity="0.16"/>
      <circle class="bulb right" cx="38" cy="10" r="3.4" fill="#5fb3a3"/>
    </svg>
    <div>
      <div class="brand-name">Together <span class="version-badge" id="versionBadge"></span></div>
    </div>
  </div>

  <div class="room-wrap">
    <div class="room-top">
      <div>
        <div class="room-title" id="videoTitle">Loading...</div>
        <div class="episode-nav-label" id="episodeNavLabel"></div>
      </div>
      <div class="people" id="peopleList"></div>
    </div>

    <div class="vplayer" id="vplayer">
      <div class="vplayer-frame" id="vplayerFrame">
        <video id="player" playsinline></video>

        <div class="video-msg-stack" id="videoMsgStack"></div>

        <div class="vplayer-controls" id="vplayerControls">
          <input type="range" id="seekRange" class="vplayer-seek" min="0" max="100" step="0.01" value="0" />
          <div class="vplayer-row">
            <button class="vplayer-btn" id="prevBtn" title="Previous episode"></button>
            <button class="vplayer-btn" id="playPauseBtn" title="Play/Pause"></button>
            <button class="vplayer-btn" id="nextBtn" title="Next episode"></button>
            <span class="vplayer-time" id="vplayerTime">0:00 / 0:00</span>

            <div class="vplayer-spacer"></div>

            <div class="vplayer-reactions">
              <button type="button" class="vplayer-reaction-btn" data-emoji="👍">👍</button>
              <button type="button" class="vplayer-reaction-btn" data-emoji="😂">😂</button>
              <button type="button" class="vplayer-reaction-btn" data-emoji="❤️">❤️</button>
              <button type="button" class="vplayer-reaction-btn" data-emoji="😮">😮</button>
            </div>

            <button class="vplayer-btn" id="muteBtn" title="Mute"></button>
            <input type="range" id="volumeRange" class="vplayer-volume" min="0" max="1" step="0.05" value="1" />
            <button class="vplayer-btn" id="fullscreenBtn" title="Fullscreen"></button>
          </div>
        </div>
      </div>
    </div>

    <div class="status-bar">
      <span id="statusText"></span>
      <span id="liveIndicator"></span>
    </div>

    <div class="chat-panel">
      <div class="chat-header">Chat</div>
      <div class="chat-messages" id="chatMessages"></div>
      <form class="chat-input-row" id="chatForm">
        <textarea id="chatInput" rows="1" placeholder="Type a message (Shift+Enter for a new line)" maxlength="2000"></textarea>
        <button type="submit" class="btn btn-primary chat-send-btn">Send</button>
      </form>
    </div>

    <div class="copy-row">
      <button class="btn btn-ghost" id="copyBtn">Copy episode link</button>
      <button class="btn btn-ghost" id="homeBtn">Back to episodes</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="videos.js"></script>
  <script src="common.js"></script>
  <script>
    const ICONS = {
      play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
      pause: '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
      prev: '<svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm12 12V6l-10 6z"/></svg>',
      next: '<svg viewBox="0 0 24 24"><path d="M18 6h-2v12h2zM6 6v12l10-6z"/></svg>',
      volume: '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16.2 8.3a5 5 0 010 7.4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>',
      mute: '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M15.5 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>',
      expand: '<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      shrink: '<svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    };

    const params = new URLSearchParams(window.location.search);
    const videoId = params.get("video");
    const myName = getMyName();
    const myClientId = getMyClientId();

    const video = VIDEO_LIST.find((v) => v.id === videoId);

    if (!video || !myName) {
      window.location.href = "index.html" + (videoId ? "?video=" + videoId : "");
    }

    applyVersionBadge();

    const sb = initSupabase();
    const player = document.getElementById("player");
    const vplayer = document.getElementById("vplayer");
    const vplayerFrame = document.getElementById("vplayerFrame");
    const vplayerControls = document.getElementById("vplayerControls");
    const statusText = document.getElementById("statusText");
    const liveIndicator = document.getElementById("liveIndicator");
    const peopleList = document.getElementById("peopleList");
    const toast = document.getElementById("toast");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const episodeNavLabel = document.getElementById("episodeNavLabel");
    const chatMessages = document.getElementById("chatMessages");
    const chatForm = document.getElementById("chatForm");
    const chatInput = document.getElementById("chatInput");
    const videoMsgStack = document.getElementById("videoMsgStack");
    const playPauseBtn = document.getElementById("playPauseBtn");
    const seekRange = document.getElementById("seekRange");
    const vplayerTime = document.getElementById("vplayerTime");
    const muteBtn = document.getElementById("muteBtn");
    const volumeRange = document.getElementById("volumeRange");
    const fullscreenBtn = document.getElementById("fullscreenBtn");

    playPauseBtn.innerHTML = ICONS.play;
    prevBtn.innerHTML = ICONS.prev;
    nextBtn.innerHTML = ICONS.next;
    muteBtn.innerHTML = ICONS.volume;
    fullscreenBtn.innerHTML = ICONS.expand;

    let sessionMaxFraction = 0;
    let progressReady = false;

    let applyingRemote = false;
    const SEEK_TOLERANCE = 1.2; // seconds - below this gap, no need to re-sync

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function flashSynced() {
      vplayerFrame.classList.add("synced");
      setTimeout(() => vplayerFrame.classList.remove("synced"), 500);
    }

    // --- set up this episode ---
    document.getElementById("videoTitle").textContent = video.title;
    player.src = video.url;

    fetchProgressMap([video.id]).then((map) => {
      sessionMaxFraction = map[video.id] || 0;
      progressReady = true;
    });

    // ===================== custom player controls =====================

    function formatDuration(sec) {
      if (!isFinite(sec) || sec < 0) sec = 0;
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = Math.floor(sec % 60);
      const mm = h > 0 ? String(m).padStart(2, "0") : String(m);
      const ss = String(s).padStart(2, "0");
      return h > 0 ? h + ":" + mm + ":" + ss : mm + ":" + ss;
    }

    function paintRange(el, pct) {
      const p = Math.max(0, Math.min(100, pct));
      el.style.background = "linear-gradient(to right, var(--accent) " + p + "%, rgba(255,255,255,0.25) " + p + "%)";
    }

    let isScrubbing = false;

    player.addEventListener("loadedmetadata", () => {
      seekRange.max = player.duration || 0;
      vplayerTime.textContent = formatDuration(player.currentTime) + " / " + formatDuration(player.duration);
    });

    player.addEventListener("timeupdate", () => {
      if (isScrubbing) return;
      seekRange.value = player.currentTime;
      paintRange(seekRange, (player.currentTime / (player.duration || 1)) * 100);
      vplayerTime.textContent = formatDuration(player.currentTime) + " / " + formatDuration(player.duration);
    });

    seekRange.addEventListener("input", () => {
      isScrubbing = true;
      paintRange(seekRange, (seekRange.value / (player.duration || 1)) * 100);
      vplayerTime.textContent = formatDuration(parseFloat(seekRange.value)) + " / " + formatDuration(player.duration);
    });

    seekRange.addEventListener("change", () => {
      player.currentTime = parseFloat(seekRange.value);
      isScrubbing = false;
    });

    function togglePlay() {
      if (player.paused) player.play().catch(() => {});
      else player.pause();
    }

    playPauseBtn.addEventListener("click", togglePlay);
    player.addEventListener("click", togglePlay);
    player.addEventListener("play", () => { playPauseBtn.innerHTML = ICONS.pause; showControls(); });
    player.addEventListener("pause", () => { playPauseBtn.innerHTML = ICONS.play; showControls(); });

    volumeRange.addEventListener("input", () => {
      player.volume = parseFloat(volumeRange.value);
      player.muted = player.volume === 0;
      paintRange(volumeRange, player.volume * 100);
      muteBtn.innerHTML = player.muted ? ICONS.mute : ICONS.volume;
    });

    muteBtn.addEventListener("click", () => {
      player.muted = !player.muted;
      muteBtn.innerHTML = player.muted ? ICONS.mute : ICONS.volume;
      if (!player.muted && player.volume === 0) {
        player.volume = 1;
        volumeRange.value = 1;
      }
      paintRange(volumeRange, player.muted ? 0 : player.volume * 100);
    });

    paintRange(volumeRange, 100);
    paintRange(seekRange, 0);

    fullscreenBtn.addEventListener("click", () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else vplayer.requestFullscreen().catch(() => {});
    });

    document.addEventListener("fullscreenchange", () => {
      fullscreenBtn.innerHTML = document.fullscreenElement ? ICONS.shrink : ICONS.expand;
    });

    // auto-hide controls while playing and idle
    let idleTimer;
    function showControls() {
      vplayerControls.classList.remove("idle");
      clearTimeout(idleTimer);
      if (!player.paused) {
        idleTimer = setTimeout(() => vplayerControls.classList.add("idle"), 2600);
      }
    }
    vplayer.addEventListener("mousemove", showControls);
    vplayer.addEventListener("mouseleave", () => {
      if (!player.paused) vplayerControls.classList.add("idle");
    });
    showControls();

    // ===================== message bubbles over the video =====================

    function showVideoMessage(name, body) {
      const el = document.createElement("div");
      el.className = "video-msg";
      const nameEl = document.createElement("span");
      nameEl.className = "video-msg-name";
      nameEl.textContent = name + ":";
      el.appendChild(nameEl);
      el.appendChild(document.createTextNode(" " + body));
      videoMsgStack.appendChild(el);
      setTimeout(() => {
        el.classList.add("leaving");
        setTimeout(() => el.remove(), 320);
      }, 3000);
    }

    // --- chat history for this episode ---
    function formatTime(iso) {
      try {
        return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      } catch (e) {
        return "";
      }
    }

    function renderChatMessage(msg, isMine) {
      const wasAtBottom = chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight < 40;

      const wrap = document.createElement("div");
      wrap.className = "chat-msg" + (isMine ? " me" : "");

      const meta = document.createElement("div");
      meta.className = "chat-msg-meta";
      const time = formatTime(msg.created_at);
      meta.textContent = msg.name + (time ? " · " + time : "");

      const body = document.createElement("div");
      body.className = "chat-msg-body";
      body.textContent = msg.body;

      wrap.appendChild(meta);
      wrap.appendChild(body);
      chatMessages.appendChild(wrap);

      if (wasAtBottom) chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    fetchChatHistory(video.id).then((rows) => {
      if (rows.length === 0) {
        const empty = document.createElement("div");
        empty.className = "chat-empty";
        empty.id = "chatEmpty";
        empty.textContent = "No messages yet — say hi 👋";
        chatMessages.appendChild(empty);
        return;
      }
      rows.forEach((row) => renderChatMessage(row, row.sender_id === myClientId));
      chatMessages.scrollTop = chatMessages.scrollHeight;
    });

    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        chatForm.requestSubmit();
      }
    });

    chatInput.addEventListener("input", () => {
      chatInput.style.height = "auto";
      chatInput.style.height = Math.min(chatInput.scrollHeight, 140) + "px";
    });

    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (!text) return;
      chatInput.value = "";
      chatInput.style.height = "auto";

      const emptyEl = document.getElementById("chatEmpty");
      if (emptyEl) emptyEl.remove();

      const msg = { name: myName, body: text, created_at: new Date().toISOString() };
      renderChatMessage(msg, true);
      showVideoMessage(msg.name, msg.body);
      channel.send({ type: "broadcast", event: "chat", payload: msg });
      sendChatMessage(video.id, myClientId, myName, text);
    });

    const idx = VIDEO_LIST.findIndex((v) => v.id === video.id);
    prevBtn.disabled = idx <= 0;
    nextBtn.disabled = idx === -1 || idx >= VIDEO_LIST.length - 1;
    episodeNavLabel.textContent = idx !== -1 ? "Episode " + (idx + 1) + " of " + VIDEO_LIST.length : "";
    if (idx > 0) prevBtn.title = "Previous: " + VIDEO_LIST[idx - 1].title;
    if (idx !== -1 && idx < VIDEO_LIST.length - 1) nextBtn.title = "Next: " + VIDEO_LIST[idx + 1].title;

    prevBtn.addEventListener("click", () => {
      if (idx > 0) window.location.href = "room.html?video=" + VIDEO_LIST[idx - 1].id;
    });
    nextBtn.addEventListener("click", () => {
      if (idx !== -1 && idx < VIDEO_LIST.length - 1) window.location.href = "room.html?video=" + VIDEO_LIST[idx + 1].id;
    });

    // --- realtime channel for this episode (playback events + who's watching) ---
    // everyone watching the same episode shares this channel; other episodes are independent
    const channel = sb.channel("episode:" + video.id, {
      config: {
        broadcast: { self: false },
        presence: { key: myClientId }
      }
    });

    channel.on("broadcast", { event: "playback" }, (msg) => {
      const p = msg.payload;
      applyingRemote = true;
      flashSynced();

      if (Math.abs(player.currentTime - p.time) > SEEK_TOLERANCE) {
        player.currentTime = p.time;
      }

      if (p.action === "play") {
        player.play().catch(() => {});
        statusText.textContent = "Your friend hit play";
      } else if (p.action === "pause") {
        player.pause();
        statusText.textContent = "Your friend paused";
      } else if (p.action === "seek") {
        statusText.textContent = "Your friend jumped to a new spot";
      }

      setTimeout(() => { applyingRemote = false; }, 400);
    });

    channel.on("broadcast", { event: "chat" }, (msg) => {
      const emptyEl = document.getElementById("chatEmpty");
      if (emptyEl) emptyEl.remove();
      renderChatMessage(msg.payload, false);
      showVideoMessage(msg.payload.name, msg.payload.body);
    });

    channel.on("broadcast", { event: "reaction" }, (msg) => {
      spawnReaction(msg.payload.emoji);
    });

    channel.on("presence", { event: "sync" }, () => {
      const state = channel.presenceState();
      peopleList.innerHTML = "";
      const ids = Object.keys(state);
      const othersCount = ids.length - 1;

      ids.forEach((id) => {
        const info = state[id][0];
        const chip = document.createElement("div");
        chip.className = "chip";
        const dot = document.createElement("span");
        dot.className = "dot" + (id === myClientId ? " me" : "") + (othersCount > 0 ? " live" : "");
        chip.appendChild(dot);
        chip.appendChild(document.createTextNode(info.name + (id === myClientId ? " (you)" : "")));
        peopleList.appendChild(chip);
      });

      liveIndicator.textContent = othersCount > 0 ? "Your friend is here ●" : "Watching alone for now";
      liveIndicator.className = othersCount > 0 ? "live" : "";
    });

    channel.subscribe(async (status) => {
      if (status === "SUBSCRIBED") {
        await channel.track({ name: myName });
      }
    });

    function sendPlayback(action) {
      if (applyingRemote) return;
      channel.send({
        type: "broadcast",
        event: "playback",
        payload: { action: action, time: player.currentTime }
      });
    }

    player.addEventListener("play", () => sendPlayback("play"));
    player.addEventListener("pause", () => sendPlayback("pause"));
    player.addEventListener("seeked", () => sendPlayback("seek"));

    // when a video truly finishes, mark it as fully watched (avoids rounding gaps
    // between the last timeupdate and the real end of the video)
    player.addEventListener("ended", () => {
      sessionMaxFraction = 1;
      saveSharedProgress(video.id, 1);
    });

    // --- save watch progress, shared with your friend, so the home page can show it ---
    let lastProgressSave = 0;
    function maybeSaveProgress(force) {
      if (!progressReady || !player.duration) return;
      const frac = player.currentTime / player.duration;
      if (frac <= sessionMaxFraction) return;
      const now = Date.now();
      if (!force && now - lastProgressSave < 4000) return;
      lastProgressSave = now;
      sessionMaxFraction = frac;
      saveSharedProgress(video.id, frac);
    }
    player.addEventListener("timeupdate", () => maybeSaveProgress(false));
    player.addEventListener("pause", () => maybeSaveProgress(true));
    window.addEventListener("beforeunload", () => maybeSaveProgress(true));

    // --- quick emoji reactions ---
    function spawnReaction(emoji) {
      const el = document.createElement("span");
      el.className = "reaction-float";
      el.textContent = emoji;
      el.style.right = (10 + Math.random() * 60) + "px";
      vplayer.appendChild(el);
      setTimeout(() => el.remove(), 1400);
    }

    document.querySelectorAll(".vplayer-reaction-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const emoji = btn.dataset.emoji;
        spawnReaction(emoji);
        channel.send({ type: "broadcast", event: "reaction", payload: { emoji: emoji } });
      });
    });

    // --- buttons ---
    document.getElementById("copyBtn").addEventListener("click", () => {
      const link = window.location.origin + window.location.pathname + "?video=" + video.id;
      navigator.clipboard.writeText(link).then(() => showToast("Link copied ✓"));
    });

    document.getElementById("homeBtn").addEventListener("click", () => {
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
