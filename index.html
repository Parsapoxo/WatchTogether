<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Together</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="brandbar">
    <svg class="lamps" viewBox="0 0 46 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line class="link-line" x1="14" y1="10" x2="32" y2="10" stroke="#93a0bd" stroke-width="1"/>
      <circle class="halo" cx="8" cy="10" r="7" fill="#f2a541" fill-opacity="0.16"/>
      <circle class="bulb" cx="8" cy="10" r="3.4" fill="#f2a541"/>
      <circle class="halo right" cx="38" cy="10" r="7" fill="#5fb3a3" fill-opacity="0.16"/>
      <circle class="bulb right" cx="38" cy="10" r="3.4" fill="#5fb3a3"/>
    </svg>
    <div>
      <div class="brand-name">Together <span class="version-badge" id="versionBadge"></span></div>
    </div>
  </div>

  <div class="page">
    <div class="page-inner">

      <div class="card">
        <h1>One video. Two of you.</h1>
        <p class="lede">Add your name, then start a new room or join your friend's with a code.</p>

        <div class="field">
          <label for="nameInput">Your name</label>
          <input id="nameInput" type="text" placeholder="e.g. Parsa" maxlength="20" />
        </div>

        <div class="tabs">
          <div class="tab-indicator" id="tabIndicator"></div>
          <div class="tab active" id="tabCreate">Start a room</div>
          <div class="tab" id="tabJoin">Join a room</div>
        </div>

        <div id="createPane" class="pane">
          <p class="hint-line">Pick a video from the list on the right, then start the room.</p>
          <button class="btn btn-primary" id="createBtn">Start room</button>
        </div>

        <div id="joinPane" class="pane" style="display:none;">
          <div class="field">
            <label for="codeInput">Room code</label>
            <input id="codeInput" type="text" placeholder="e.g. 7GK4Q" maxlength="6" style="text-transform:uppercase" />
          </div>
          <button class="btn btn-primary" id="joinBtn">Join</button>
        </div>

        <div class="error-text" id="errorText"></div>
      </div>

      <div class="episode-panel" id="episodePanel">
        <div class="episode-panel-head">
          <span>Episodes</span>
          <input id="episodeSearch" type="text" placeholder="Search episodes" />
        </div>
        <div class="episode-list" id="episodeList"></div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="videos.js"></script>
  <script src="common.js"></script>
  <script>
    const nameInput = document.getElementById("nameInput");
    const errorText = document.getElementById("errorText");
    const tabCreate = document.getElementById("tabCreate");
    const tabJoin = document.getElementById("tabJoin");
    const tabIndicator = document.getElementById("tabIndicator");
    const createPane = document.getElementById("createPane");
    const joinPane = document.getElementById("joinPane");
    const codeInput = document.getElementById("codeInput");
    const episodePanel = document.getElementById("episodePanel");
    const episodeList = document.getElementById("episodeList");
    const episodeSearch = document.getElementById("episodeSearch");

    applyVersionBadge();
    nameInput.value = getMyName();

    let selectedVideoId = VIDEO_LIST[0].id;

    function episodeNumber(video) {
      const m = video.title.match(/^(\d+)/);
      return m ? parseInt(m[1], 10) : null;
    }

    fetchProgressMap(VIDEO_LIST.map((v) => v.id)).then((progressMap) => {
      const continueVideo = VIDEO_LIST.find((v) => Math.round((progressMap[v.id] || 0) * 100) < 100) || VIDEO_LIST[VIDEO_LIST.length - 1];
      selectedVideoId = continueVideo.id;

      VIDEO_LIST.forEach((v) => {
        const pct = Math.round((progressMap[v.id] || 0) * 100);
        const num = episodeNumber(v);

        const row = document.createElement("div");
        row.className = "episode-row" + (v.id === selectedVideoId ? " selected" : "");
        row.dataset.search = (num !== null ? num : "") + " " + v.title.toLowerCase();

        const main = document.createElement("div");
        main.className = "episode-row-main";

        const titleWrap = document.createElement("span");
        titleWrap.className = "episode-row-title";
        titleWrap.textContent = v.title;

        const titleGroup = document.createElement("span");
        titleGroup.className = "episode-row-title-group";
        titleGroup.appendChild(titleWrap);

        if (v.id === continueVideo.id) {
          const badge = document.createElement("span");
          badge.className = "episode-badge";
          badge.textContent = pct > 0 ? "Continue" : "Up next";
          titleGroup.appendChild(badge);
        }

        const pctEl = document.createElement("span");
        pctEl.className = "episode-row-pct";
        pctEl.textContent = pct + "%";

        main.appendChild(titleGroup);
        main.appendChild(pctEl);

        const track = document.createElement("div");
        track.className = "episode-row-track";
        const fill = document.createElement("div");
        fill.className = "episode-row-fill";
        fill.style.width = pct + "%";
        track.appendChild(fill);

        row.appendChild(main);
        row.appendChild(track);

        row.addEventListener("click", () => {
          episodeList.querySelectorAll(".episode-row.selected").forEach((r) => r.classList.remove("selected"));
          row.classList.add("selected");
          selectedVideoId = v.id;
        });

        episodeList.appendChild(row);
      });
    });

    episodeSearch.addEventListener("input", () => {
      const q = episodeSearch.value.trim().toLowerCase();
      episodeList.querySelectorAll(".episode-row").forEach((row) => {
        row.style.display = row.dataset.search.includes(q) ? "" : "none";
      });
    });

    function getSelectedVideo() {
      return VIDEO_LIST.find((v) => v.id === selectedVideoId);
    }

    function showCreate() {
      tabCreate.classList.add("active");
      tabJoin.classList.remove("active");
      tabIndicator.classList.remove("pos-1");
      createPane.style.display = "block";
      joinPane.style.display = "none";
      episodePanel.style.display = "block";
      errorText.textContent = "";
    }

    function showJoin() {
      tabJoin.classList.add("active");
      tabCreate.classList.remove("active");
      tabIndicator.classList.add("pos-1");
      joinPane.style.display = "block";
      createPane.style.display = "none";
      episodePanel.style.display = "none";
      errorText.textContent = "";
    }

    tabCreate.addEventListener("click", showCreate);
    tabJoin.addEventListener("click", showJoin);

    function requireName() {
      const name = nameInput.value.trim();
      if (!name) {
        errorText.textContent = "Enter your name first.";
        nameInput.focus();
        return null;
      }
      setMyName(name);
      return name;
    }

    document.getElementById("createBtn").addEventListener("click", async () => {
      const name = requireName();
      if (!name) return;

      const video = getSelectedVideo();

      try {
        const sb = initSupabase();
        const roomCode = makeRoomCode();
        const { error } = await sb.from("rooms").insert({
          code: roomCode,
          video: video
        });
        if (error) throw error;
        window.location.href = "room.html?room=" + roomCode;
      } catch (e) {
        errorText.textContent = "Couldn't create the room. Check your Supabase config and database table (see README).";
        console.error(e);
      }
    });

    document.getElementById("joinBtn").addEventListener("click", async () => {
      const name = requireName();
      if (!name) return;

      const code = codeInput.value.trim().toUpperCase();
      if (!code) {
        errorText.textContent = "Enter the room code.";
        return;
      }

      try {
        const sb = initSupabase();
        const { data, error } = await sb.from("rooms").select("code").eq("code", code).maybeSingle();
        if (error) throw error;
        if (!data) {
          errorText.textContent = "No room found with that code. Double-check it.";
          return;
        }
        window.location.href = "room.html?room=" + code;
      } catch (e) {
        errorText.textContent = "Something went wrong. Check your Supabase config and database table (see README).";
        console.error(e);
      }
    });

    // Support a direct link like index.html?room=XXXX that jumps straight to the join tab
    const params = new URLSearchParams(window.location.search);
    if (params.get("room")) {
      showJoin();
      codeInput.value = params.get("room").toUpperCase();
    }
  </script>
</body>
</html>
