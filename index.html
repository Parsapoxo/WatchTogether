<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Together</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="brandbar">
    <svg class="lamps" viewBox="0 0 46 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line class="link-line" x1="14" y1="10" x2="32" y2="10" stroke="#93a0bd" stroke-width="1"/>
      <circle class="halo" cx="8" cy="10" r="7" fill="#f2a541" fill-opacity="0.16"/>
      <circle class="bulb" cx="8" cy="10" r="3.4" fill="#f2a541"/>
      <circle class="halo right" cx="38" cy="10" r="7" fill="#5fb3a3" fill-opacity="0.16"/>
      <circle class="bulb right" cx="38" cy="10" r="3.4" fill="#5fb3a3"/>
    </svg>
    <div>
      <div class="brand-name">Together <span class="version-badge" id="versionBadge"></span></div>
    </div>
  </div>

  <div class="page">
    <div class="page-inner">

      <div class="card">
        <h1>One video. Two of you.</h1>
        <p class="lede">Add your name, pick an episode from the list, and hit start.</p>

        <div class="field">
          <label for="nameInput">Your name</label>
          <input id="nameInput" type="text" placeholder="e.g. Parsa" maxlength="20" />
        </div>

        <p class="hint-line">Picking an episode takes you straight to it. If your friend picks the same one, you'll be in sync there together — different episodes stay independent.</p>

        <div class="error-text" id="errorText"></div>
        <button class="btn btn-primary" id="startBtn">Start</button>
      </div>

      <div class="episode-panel" id="episodePanel">
        <div class="episode-panel-head">
          <button class="panel-title-btn" id="panelTitleBtn">Sections</button>
          <input id="episodeSearch" type="text" placeholder="Search episodes" style="display:none;" />
        </div>
        <div class="episode-list" id="episodeList"></div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="videos.js"></script>
  <script src="common.js"></script>
  <script>
    const nameInput = document.getElementById("nameInput");
    const errorText = document.getElementById("errorText");
    const episodeList = document.getElementById("episodeList");
    const episodeSearch = document.getElementById("episodeSearch");
    const panelTitleBtn = document.getElementById("panelTitleBtn");

    applyVersionBadge();
    nameInput.value = getMyName();

    const params = new URLSearchParams(window.location.search);
    const urlVideoId = params.get("video");

    let selectedVideoId = (urlVideoId && VIDEO_LIST.some((v) => v.id === urlVideoId)) ? urlVideoId : VIDEO_LIST[0].id;
    let currentSection = null; // null = showing the section picker

    function episodeNumber(video) {
      const m = video.title.match(/^(\d+)/);
      return m ? parseInt(m[1], 10) : null;
    }

    function pctFor(map, id) {
      return Math.round((map[id] || 0) * 100);
    }

    function makeProgressRow(title, pct, badgeText) {
      const row = document.createElement("div");
      row.className = "episode-row";

      const main = document.createElement("div");
      main.className = "episode-row-main";

      const titleWrap = document.createElement("span");
      titleWrap.className = "episode-row-title";
      titleWrap.textContent = title;

      const titleGroup = document.createElement("span");
      titleGroup.className = "episode-row-title-group";
      titleGroup.appendChild(titleWrap);

      if (badgeText) {
        const badge = document.createElement("span");
        badge.className = "episode-badge";
        badge.textContent = badgeText;
        titleGroup.appendChild(badge);
      }

      const pctEl = document.createElement("span");
      pctEl.className = "episode-row-pct";
      pctEl.textContent = pct + "%";

      main.appendChild(titleGroup);
      main.appendChild(pctEl);

      const track = document.createElement("div");
      track.className = "episode-row-track";
      const fill = document.createElement("div");
      fill.className = "episode-row-fill";
      fill.style.width = pct + "%";
      track.appendChild(fill);

      row.appendChild(main);
      row.appendChild(track);
      return row;
    }

    function renderSections(progressMap) {
      currentSection = null;
      panelTitleBtn.textContent = "Sections";
      panelTitleBtn.classList.remove("is-back");
      episodeSearch.style.display = "none";
      episodeSearch.value = "";
      episodeList.innerHTML = "";

      SECTIONS.forEach((section) => {
        const videosInSection = VIDEO_LIST.filter((v) => v.section === section.id);
        const sumFraction = videosInSection.reduce((sum, v) => sum + (progressMap[v.id] || 0), 0);
        const pct = Math.min(100, Math.round((sumFraction / section.totalEpisodes) * 100));

        const row = makeProgressRow(section.title + " (" + section.totalEpisodes + " episodes)", pct, null);
        row.addEventListener("click", () => renderEpisodes(section.id, progressMap));
        episodeList.appendChild(row);
      });
    }

    function renderEpisodes(sectionId, progressMap) {
      currentSection = sectionId;
      const section = SECTIONS.find((s) => s.id === sectionId);
      panelTitleBtn.textContent = "← " + section.title;
      panelTitleBtn.classList.add("is-back");
      episodeSearch.style.display = "";
      episodeSearch.value = "";
      episodeList.innerHTML = "";

      const videosInSection = VIDEO_LIST.filter((v) => v.section === sectionId);
      const continueVideo = videosInSection.find((v) => pctFor(progressMap, v.id) < 100) || videosInSection[videosInSection.length - 1];

      if (!(urlVideoId && videosInSection.some((v) => v.id === urlVideoId)) && continueVideo) {
        selectedVideoId = continueVideo.id;
      }

      videosInSection.forEach((v) => {
        const pct = pctFor(progressMap, v.id);
        const num = episodeNumber(v);
        const badgeText = continueVideo && v.id === continueVideo.id ? (pct > 0 ? "Continue" : "Up next") : null;

        const row = makeProgressRow(v.title, pct, badgeText);
        row.dataset.search = (num !== null ? num : "") + " " + v.title.toLowerCase();
        if (v.id === selectedVideoId) row.classList.add("selected");

        row.addEventListener("click", () => {
          episodeList.querySelectorAll(".episode-row.selected").forEach((r) => r.classList.remove("selected"));
          row.classList.add("selected");
          selectedVideoId = v.id;
        });

        episodeList.appendChild(row);
      });
    }

    panelTitleBtn.addEventListener("click", () => {
      if (currentSection !== null) renderSections(lastProgressMap);
    });

    episodeSearch.addEventListener("input", () => {
      const q = episodeSearch.value.trim().toLowerCase();
      episodeList.querySelectorAll(".episode-row").forEach((row) => {
        row.style.display = row.dataset.search.includes(q) ? "" : "none";
      });
    });

    let lastProgressMap = {};

    fetchProgressMap(VIDEO_LIST.map((v) => v.id)).then((progressMap) => {
      lastProgressMap = progressMap;

      if (urlVideoId) {
        const video = VIDEO_LIST.find((v) => v.id === urlVideoId);
        if (video) {
          renderEpisodes(video.section, progressMap);
          return;
        }
      }

      renderSections(progressMap);
    });

    document.getElementById("startBtn").addEventListener("click", () => {
      const name = nameInput.value.trim();
      if (!name) {
        errorText.textContent = "Enter your name first.";
        nameInput.focus();
        return;
      }
      if (currentSection === null) {
        errorText.textContent = "Pick a section and an episode first.";
        return;
      }
      setMyName(name);
      window.location.href = "room.html?video=" + selectedVideoId;
    });
  </script>
</body>
</html>
