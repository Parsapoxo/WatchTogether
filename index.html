<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Together</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="home-page">

  <header class="home-header">
    <div class="brandbar">
      <svg class="lamps" viewBox="0 0 46 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line class="link-line" x1="14" y1="10" x2="32" y2="10" stroke="#93a0bd" stroke-width="1"/>
        <circle class="halo" cx="8" cy="10" r="7" fill="#f2a541" fill-opacity="0.16"/>
        <circle class="bulb" cx="8" cy="10" r="3.4" fill="#f2a541"/>
        <circle class="halo right" cx="38" cy="10" r="7" fill="#5fb3a3" fill-opacity="0.16"/>
        <circle class="bulb right" cx="38" cy="10" r="3.4" fill="#5fb3a3"/>
      </svg>
      <div>
        <div class="brand-name">Together <span class="version-badge" id="versionBadge"></span></div>
      </div>
    </div>

    <label class="name-pill" id="namePill">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/></svg>
      <input id="nameInput" type="text" placeholder="Your name" maxlength="20" autocomplete="off" />
      <span class="name-hint">Add your name to start</span>
    </label>
  </header>

  <main class="home-wrap">

    <section id="viewHome">
      <div class="hero">
        <div class="hero-copy">
          <p class="hero-greeting rise" id="greeting" style="--d:.05s"></p>
          <h1 class="hero-title rise" style="--d:.12s">One video.<br />Two of you.</h1>
          <p class="hero-sub rise" style="--d:.2s">Pick up the course right where you left off. Play, pause and seek stay in sync — no codes, no setup.</p>

          <svg class="hero-lamps rise" style="--d:.3s" viewBox="0 0 460 70" fill="none" aria-hidden="true">
            <line class="hl-line" x1="62" y1="35" x2="398" y2="35" stroke="#93a0bd" stroke-width="1.5"/>
            <circle class="hl-halo" cx="34" cy="35" r="28" fill="#f2a541"/>
            <circle class="hl-bulb" cx="34" cy="35" r="11" fill="#f2a541"/>
            <circle class="hl-halo teal" cx="426" cy="35" r="28" fill="#5fb3a3"/>
            <circle class="hl-bulb teal" cx="426" cy="35" r="11" fill="#5fb3a3"/>
            <circle class="hl-pulse" cx="62" cy="35" r="4" fill="#f2a541"/>
            <circle class="hl-pulse back" cx="62" cy="35" r="4" fill="#5fb3a3"/>
          </svg>

          <div class="hero-stats rise" style="--d:.38s" id="heroStats"></div>
        </div>

        <div class="continue-card rise" style="--d:.25s" id="continueCard">
          <div class="cc-loading">Loading your progress…</div>
        </div>
      </div>

      <div class="block-title rise" style="--d:.45s">
        <h2>Sections</h2>
        <span>Pick one to browse its episodes</span>
      </div>
      <div class="sections-grid" id="sectionsGrid"></div>
    </section>

    <section id="viewEpisodes" hidden>
      <div class="eps-head">
        <button class="back-btn" id="backBtn" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
          Sections
        </button>
        <div class="eps-heading">
          <h2 id="epsTitle"></h2>
          <p id="epsMeta"></p>
        </div>
        <label class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="episodeSearch" type="text" placeholder="Search episodes" autocomplete="off" />
        </label>
      </div>
      <div class="eps-grid" id="epsGrid"></div>
      <div class="empty-state" id="noResults" hidden>No episodes match your search.</div>
    </section>

  </main>

  <div class="start-bar" id="startBar" hidden>
    <div class="start-bar-info">
      <div class="start-bar-label">Selected episode</div>
      <div class="start-bar-title" id="startBarTitle"></div>
    </div>
    <button class="btn btn-primary btn-glow" id="startSelectedBtn" type="button">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <span>Start watching</span>
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="videos.js"></script>
  <script src="common.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const nameInput = $("nameInput");
    const namePill = $("namePill");
    const greeting = $("greeting");
    const viewHome = $("viewHome");
    const viewEpisodes = $("viewEpisodes");
    const continueCard = $("continueCard");
    const sectionsGrid = $("sectionsGrid");
    const heroStats = $("heroStats");
    const epsTitle = $("epsTitle");
    const epsMeta = $("epsMeta");
    const epsGrid = $("epsGrid");
    const noResults = $("noResults");
    const episodeSearch = $("episodeSearch");
    const startBar = $("startBar");
    const startBarTitle = $("startBarTitle");

    const PLAY_SVG = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
    const ARROW_SVG = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
    const REDUCED_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    applyVersionBadge();
    nameInput.value = getMyName();

    const params = new URLSearchParams(window.location.search);
    const urlVideoId = params.get("video");
    if (urlVideoId) viewHome.hidden = true; // we'll jump straight into the right section

    let progressMap = {};
    let currentSection = null;
    let selectedVideoId = null;

    // ---------- small helpers ----------

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined && text !== null) node.textContent = text;
      return node;
    }

    function nextFrame(fn) {
      requestAnimationFrame(() => requestAnimationFrame(fn));
    }

    function countUp(node, target, suffix) {
      suffix = suffix || "";
      if (REDUCED_MOTION || target === 0) {
        node.textContent = target + suffix;
        return;
      }
      const duration = 900;
      const start = performance.now();
      function tick(now) {
        const p = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - p, 3);
        node.textContent = Math.round(target * eased) + suffix;
        if (p < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    const pctOf = (id) => Math.round((progressMap[id] || 0) * 100);
    const isDone = (id) => pctOf(id) >= 100;

    // a leading number in the title ("40 - Training") is used as-is; titles without one
    // fall back to their position inside their section
    function epNumber(video) {
      const m = video.title.match(/^(\d+)/);
      if (m) return m[1];
      const pos = VIDEO_LIST.filter((v) => v.section === video.section).indexOf(video);
      return pos >= 0 ? String(pos + 1) : null;
    }

    function epName(video) {
      return video.title.replace(/^\d+\s*[-–—:]\s*/, "");
    }

    function sectionStats(section) {
      const vids = VIDEO_LIST.filter((v) => v.section === section.id);
      const sum = vids.reduce((s, v) => s + (progressMap[v.id] || 0), 0);
      const done = vids.filter((v) => isDone(v.id)).length;
      const pct = Math.min(100, Math.round((sum / section.totalEpisodes) * 100));
      const next = vids.find((v) => !isDone(v.id)) || null;
      return { vids, done, pct, next };
    }

    function findContinue() {
      const next = VIDEO_LIST.find((v) => !isDone(v.id));
      return { video: next || VIDEO_LIST[VIDEO_LIST.length - 1], allDone: !next };
    }

    // ---------- name + start ----------

    function updateGreeting() {
      const n = nameInput.value.trim();
      greeting.textContent = n ? "Welcome back, " + n : "Welcome — add your name to get started";
    }

    nameInput.addEventListener("input", updateGreeting);
    nameInput.addEventListener("change", () => {
      const n = nameInput.value.trim();
      if (n) setMyName(n);
    });
    updateGreeting();

    function flagMissingName() {
      namePill.classList.remove("needs-name");
      void namePill.offsetWidth;
      namePill.classList.add("needs-name");
      nameInput.focus();
      window.scrollTo({ top: 0, behavior: "smooth" });
      setTimeout(() => namePill.classList.remove("needs-name"), 2400);
    }

    function startEpisode(videoId) {
      const name = nameInput.value.trim();
      if (!name) {
        flagMissingName();
        return;
      }
      setMyName(name);
      window.location.href = "room.html?video=" + encodeURIComponent(videoId);
    }

    // ---------- home view ----------

    function renderContinue() {
      const { video, allDone } = findContinue();
      const pct = pctOf(video.id);
      const section = SECTIONS.find((s) => s.id === video.section);

      continueCard.innerHTML = "";

      const top = el("div", "cc-top");
      top.append(el("span", "cc-label", allDone ? "All caught up" : (pct > 0 ? "Continue watching" : "Up next")));
      top.append(el("span", "cc-section", section ? section.title : ""));

      const body = el("div", "cc-body");
      body.append(el("div", "cc-num", epNumber(video) || "•"));
      const info = el("div", "cc-info");
      info.append(el("div", "cc-title", epName(video)));
      info.append(el("div", "cc-meta", allDone ? "You've finished every episode" : (pct > 0 ? pct + "% watched" : "Not started yet")));
      body.append(info);

      const track = el("div", "cc-track");
      const fill = el("div", "cc-fill");
      track.append(fill);

      const actions = el("div", "cc-actions");
      const btn = el("button", "btn btn-primary btn-glow");
      btn.type = "button";
      btn.innerHTML = PLAY_SVG + "<span>" + (allDone ? "Watch again" : (pct > 0 ? "Continue" : "Start watching")) + "</span>";
      btn.addEventListener("click", () => startEpisode(video.id));
      actions.append(btn);

      continueCard.append(top, body, track, actions);
      nextFrame(() => { fill.style.width = pct + "%"; });
    }

    function renderStats() {
      const total = SECTIONS.reduce((s, sec) => s + sec.totalEpisodes, 0);
      const finished = VIDEO_LIST.filter((v) => isDone(v.id)).length;
      const sum = VIDEO_LIST.reduce((s, v) => s + (progressMap[v.id] || 0), 0);
      const overall = Math.min(100, Math.round((sum / total) * 100));
      const toGo = Math.max(0, total - finished);

      heroStats.innerHTML = "";
      [[finished, "", "finished"], [overall, "%", "of the course"], [toGo, "", "to go"]].forEach((item) => {
        const wrap = el("span");
        const num = el("strong", null, "0" + item[1]);
        wrap.append(num, item[2]);
        heroStats.append(wrap);
        countUp(num, item[0], item[1]);
      });
    }

    function renderSections() {
      sectionsGrid.innerHTML = "";
      const C = 2 * Math.PI * 34;

      SECTIONS.forEach((section, i) => {
        const st = sectionStats(section);

        const card = el("button", "section-card rise");
        card.type = "button";
        card.style.setProperty("--d", (0.5 + i * 0.08) + "s");

        const ring = el("div", "ring");
        ring.innerHTML = '<svg viewBox="0 0 80 80"><circle class="ring-bg" cx="40" cy="40" r="34"/><circle class="ring-fg" cx="40" cy="40" r="34"/></svg>';
        const fg = ring.querySelector(".ring-fg");
        fg.style.strokeDasharray = C;
        fg.style.strokeDashoffset = C;
        ring.append(el("span", "ring-pct", st.pct + "%"));

        const info = el("div", "sc-info");
        info.append(el("div", "sc-title", section.title));
        info.append(el("div", "sc-count", st.done + " of " + section.totalEpisodes + " episodes watched"));

        const next = el("div", "sc-next");
        if (st.vids.length === 0) {
          next.textContent = "No episodes added yet";
        } else if (st.next) {
          next.append("Next: ");
          next.append(el("b", null, (epNumber(st.next) || "•") + " · " + epName(st.next)));
        } else {
          next.textContent = "Every added episode is finished";
        }
        info.append(next);

        const arrow = el("span", "sc-arrow");
        arrow.innerHTML = ARROW_SVG;

        card.append(ring, info, arrow);
        card.addEventListener("click", () => openSection(section.id));
        sectionsGrid.append(card);

        nextFrame(() => { fg.style.strokeDashoffset = C * (1 - st.pct / 100); });
      });
    }

    function buildHome() {
      renderContinue();
      renderStats();
      renderSections();
    }

    function showHome() {
      currentSection = null;
      startBar.hidden = true;
      viewEpisodes.hidden = true;
      viewHome.hidden = false;
      buildHome();
      window.scrollTo({ top: 0 });
    }

    // ---------- episodes view ----------

    function updateStartBar() {
      const video = VIDEO_LIST.find((v) => v.id === selectedVideoId);
      if (currentSection === null || !video) {
        startBar.hidden = true;
        return;
      }
      startBarTitle.textContent = (epNumber(video) ? epNumber(video) + " · " : "") + epName(video);
      startBar.hidden = false;
    }

    function selectEpisode(videoId) {
      selectedVideoId = videoId;
      epsGrid.querySelectorAll(".ep-card.selected").forEach((c) => c.classList.remove("selected"));
      const card = epsGrid.querySelector('.ep-card[data-id="' + videoId + '"]');
      if (card) card.classList.add("selected");
      updateStartBar();
    }

    function openSection(sectionId, preselectId) {
      const section = SECTIONS.find((s) => s.id === sectionId);
      if (!section) return showHome();

      currentSection = sectionId;
      viewHome.hidden = true;
      viewEpisodes.hidden = false;
      noResults.hidden = true;
      episodeSearch.value = "";
      epsGrid.innerHTML = "";
      window.scrollTo({ top: 0 });

      const st = sectionStats(section);
      epsTitle.textContent = section.title;
      epsMeta.textContent = st.done + " of " + section.totalEpisodes + " episodes watched · " + st.vids.length + " available";

      if (st.vids.length === 0) {
        epsGrid.append(el("div", "empty-state", "No episodes have been added to this section yet."));
        startBar.hidden = true;
        return;
      }

      const focusVideo = st.next || st.vids[st.vids.length - 1];
      selectedVideoId = preselectId && st.vids.some((v) => v.id === preselectId) ? preselectId : focusVideo.id;

      st.vids.forEach((v, i) => {
        const pct = pctOf(v.id);
        const card = el("button", "ep-card" + (isDone(v.id) ? " done" : "") + (v.id === selectedVideoId ? " selected" : ""));
        card.type = "button";
        card.dataset.id = v.id;
        card.dataset.search = ((epNumber(v) || "") + " " + v.title).toLowerCase();
        card.style.setProperty("--d", Math.min(i * 0.025, 0.4) + "s");

        const top = el("div", "ep-top");
        top.append(el("div", "ep-num", epNumber(v) || "•"));

        const titleWrap = el("div", "ep-title-wrap");
        titleWrap.append(el("div", "ep-title", epName(v)));
        if (st.next && v.id === st.next.id) {
          titleWrap.append(el("span", "ep-badge", pct > 0 ? "Continue" : "Up next"));
        }
        top.append(titleWrap);
        top.append(el("span", "ep-pct", pct + "%"));

        const track = el("div", "ep-track");
        const fill = el("div", "ep-fill");
        fill.style.width = pct + "%";
        track.append(fill);

        card.append(top, track);
        card.addEventListener("click", () => selectEpisode(v.id));
        card.addEventListener("dblclick", () => startEpisode(v.id));
        epsGrid.append(card);
      });

      updateStartBar();

      const selected = epsGrid.querySelector(".ep-card.selected");
      if (selected) setTimeout(() => selected.scrollIntoView({ block: "center", behavior: "smooth" }), 150);
    }

    episodeSearch.addEventListener("input", () => {
      const q = episodeSearch.value.trim().toLowerCase();
      let visible = 0;
      epsGrid.querySelectorAll(".ep-card").forEach((card) => {
        const match = card.dataset.search.includes(q);
        card.style.display = match ? "" : "none";
        if (match) visible++;
      });
      noResults.hidden = visible !== 0 || epsGrid.querySelector(".ep-card") === null;
    });

    $("backBtn").addEventListener("click", showHome);
    $("startSelectedBtn").addEventListener("click", () => {
      if (selectedVideoId) startEpisode(selectedVideoId);
    });

    // ---------- boot ----------

    fetchProgressMap(VIDEO_LIST.map((v) => v.id)).then((map) => {
      progressMap = map;
      const video = urlVideoId ? VIDEO_LIST.find((v) => v.id === urlVideoId) : null;
      if (video) {
        buildHome();
        openSection(video.section, video.id);
      } else {
        showHome();
      }
    });
  </script>
</body>
</html>
